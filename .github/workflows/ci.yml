name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Format and analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter --version
      # The plugin library deliberately does not commit a root pubspec.lock.
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test example/test_driver
      - run: flutter analyze --fatal-infos
      - name: Check version metadata
        run: python3 tool/check_version.py
      - name: Validate package archive
        run: dart pub publish --dry-run
      - name: Test version checks
        run: python3 -m unittest discover -s tool -p 'test_*.py'

  test:
    name: Dart tests (Flutter ${{ matrix.flutter || 'stable' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.44.0', '3.47.5', '']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: flutter test --reporter expanded --test-randomize-ordering-seed=random
      - run: flutter test --reporter expanded test
        working-directory: example

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Run Android native tests
        working-directory: example/android
        run: ./gradlew :filegate:testDebugUnitTest

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: example
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/plugin_integration_test.dart -d emulator-5554

      - name: Build Android example
        working-directory: example
        run: flutter build apk --debug

  apple:
    name: iOS and macOS
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build iOS example
        working-directory: example
        run: flutter build ios --no-codesign

      - name: Build macOS example
        working-directory: example
        run: flutter build macos

      - name: Run macOS integration tests
        working-directory: example
        run: flutter test --timeout=20m integration_test/plugin_integration_test.dart -d macos

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Windows example
        working-directory: example
        env:
          FILEGATE_BUILD_TESTS: 'true'
        run: flutter build windows

      - name: Run Windows native tests
        working-directory: example/build/windows/x64/plugins/filegate
        run: ctest -C Release --output-on-failure --no-tests=error

      - name: Clean Windows native test build output
        working-directory: example
        shell: pwsh
        run: Remove-Item -Recurse -Force build/windows

      - name: Run Windows integration tests
        working-directory: example
        run: flutter test --timeout=20m integration_test/plugin_integration_test.dart -d windows

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build pkg-config xvfb

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Show Flutter version
        run: flutter --version

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Linux example
        working-directory: example
        run: flutter build linux

      - name: Run Linux native tests
        working-directory: example/build/linux/x64/release/plugins/filegate
        run: ctest --output-on-failure --no-tests=error

      - name: Run Linux integration tests
        working-directory: example
        run: xvfb-run -a flutter test --timeout=20m integration_test/plugin_integration_test.dart -d linux

  checks:
    name: CI passed
    if: always()
    needs: [quality, test, android, apple, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all checks to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          APPLE_RESULT: ${{ needs.apple.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$ANDROID_RESULT" = success
          test "$APPLE_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$LINUX_RESULT" = success

  publish:
    name: Publish to pub.dev
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tool/check_version.py --tag "$RELEASE_TAG" --check-default-branch main
      - name: Check existing publication
        id: publication
        run: python3 tool/check_publication.py --github-output "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.publication.outputs.exists == 'false'
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
        if: steps.publication.outputs.exists == 'false'
      - run: dart pub publish --dry-run
        if: steps.publication.outputs.exists == 'false'
      - name: Setup Dart OIDC
        if: steps.publication.outputs.exists == 'false'
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.4'
      - name: Publish package
        if: steps.publication.outputs.exists == 'false'
        run: dart pub publish --force

  release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tool/check_version.py --tag "$RELEASE_TAG" --check-default-branch main
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 0
          fi
          prerelease=()
          version="${RELEASE_TAG%%+*}"
          if [[ "$version" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${prerelease[@]}"
