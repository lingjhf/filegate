name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify tag matches pubspec version
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          tag="$GITHUB_REF_NAME"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version."
            exit 1
          fi

      - name: Show Flutter version
        run: flutter --version

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run package tests
        run: flutter test

      - name: Run example widget tests
        working-directory: example
        run: flutter test test/widget_test.dart

      - name: Validate pub.dev package
        run: flutter pub publish --dry-run

      - name: Build Android example
        working-directory: example
        run: flutter build apk --debug

      - name: Build iOS example
        working-directory: example
        run: flutter build ios --no-codesign

      - name: Build macOS example
        working-directory: example
        run: flutter build macos

      - name: Run macOS integration tests
        working-directory: example
        run: flutter test --timeout=20m integration_test/plugin_integration_test.dart

  validate-windows:
    name: Validate Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify tag matches pubspec version
        shell: bash
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          tag="$GITHUB_REF_NAME"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version."
            exit 1
          fi

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Run package tests
        run: flutter test

      - name: Run example widget tests
        working-directory: example
        run: flutter test test/widget_test.dart

      - name: Build Windows example
        working-directory: example
        run: flutter build windows

      - name: Run Windows native tests
        working-directory: example/build/windows/x64/plugins/filegate
        run: ctest -C Release --output-on-failure --no-tests=error

      - name: Run Windows integration tests
        working-directory: example
        run: flutter test --timeout=20m integration_test/plugin_integration_test.dart -d windows

  validate-linux:
    name: Validate Linux release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build pkg-config xvfb

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Verify tag matches pubspec version
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          tag="$GITHUB_REF_NAME"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version."
            exit 1
          fi

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Run package tests
        run: flutter test

      - name: Run example widget tests
        working-directory: example
        run: flutter test test/widget_test.dart

      - name: Build Linux example
        working-directory: example
        run: flutter build linux

      - name: Run Linux native tests
        working-directory: example/build/linux/x64/release/plugins/filegate
        run: ctest --output-on-failure --no-tests=error

      - name: Run Linux integration tests
        working-directory: example
        run: xvfb-run -a flutter test --timeout=20m integration_test/plugin_integration_test.dart -d linux

  publish:
    name: Publish
    needs:
      - validate
      - validate-windows
      - validate-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart OIDC
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Publish
        run: flutter pub publish --force
