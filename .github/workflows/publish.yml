name: Publish to pub.dev

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Validated release tag, for example v1.10.1'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: github.ref == format('refs/tags/{0}', inputs.tag)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a validated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 tool/check_version.py --tag "$RELEASE_TAG" --check-default-branch main
          gh release view "$RELEASE_TAG" >/dev/null
          release_sha="$(git rev-parse HEAD)"
          result="$(gh run list --workflow ci.yml --branch "$RELEASE_TAG" --limit 100 --json headSha,conclusion --jq "any(.[]; .headSha == \"$release_sha\" and .conclusion == \"success\")")"
          test "$result" = true
      - name: Setup Dart OIDC
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: dart pub publish --dry-run
      - run: dart pub publish --force
